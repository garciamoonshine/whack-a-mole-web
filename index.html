<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐹 Whack-a-Mole</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:#1a4a1a; color:#fff; font-family:'Segoe UI',sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:16px; }
    h1 { font-size:28px; margin-bottom:10px; }
    #stats { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-bottom:12px; }
    .stat { background:rgba(255,255,255,0.15); padding:5px 14px; border-radius:14px; font-size:13px; }
    #combo { font-size:16px; font-weight:bold; color:#ffd700; min-height:22px; margin-bottom:8px; }
    #grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:360px; width:100%; margin-bottom:14px; }
    .hole { background:#5d3317; border-radius:50%; aspect-ratio:1; display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; overflow:hidden; border:3px solid #3d2010; transition:transform 0.1s; user-select:none; }
    .hole:hover { transform:scale(1.03); }
    .hole .mole-emoji { font-size:36px; opacity:0; transition:opacity 0.15s, transform 0.15s; transform:translateY(20px); }
    .hole.active .mole-emoji { opacity:1; transform:translateY(0); }
    .hole.whacked { animation:shake 0.3s; }
    .hole.miss .mole-emoji { animation:fadeRed 0.4s; }
    .hole.mole-golden { border-color:#ffd700; box-shadow:0 0 12px #ffd700; }
    .hole.mole-bomb   { border-color:#ff4500; box-shadow:0 0 12px #ff4500; }
    .hole.mole-boss   { border-color:#9b59b6; box-shadow:0 0 16px #9b59b6; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
    @keyframes floatUp { from{opacity:1;transform:translate(-50%,-50%)} to{opacity:0;transform:translate(-50%,-120%)} }
    @keyframes fadeRed { 0%{background:#ff4444} 100%{background:#5d3317} }
    .btn { padding:10px 28px; border:none; border-radius:22px; font-size:15px; font-weight:bold; cursor:pointer; }
    #startBtn { background:#4ecca3; color:#000; }
    #startBtn:disabled { background:#777; cursor:not-allowed; }
    #legend { display:flex; gap:10px; font-size:12px; flex-wrap:wrap; justify-content:center; margin-bottom:10px; }
    .legend-item { background:rgba(255,255,255,0.1); padding:3px 10px; border-radius:10px; }
    #game-over { background:rgba(0,0,0,0.85); border-radius:16px; padding:24px; text-align:center; position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; }
    #game-over.hidden { display:none; }
    #game-over h2 { font-size:28px; }
    #restartBtn { background:#4ecca3; color:#000; }
  </style>
</head>
<body>
  <h1>🐹 Whack-a-Mole</h1>
  <div id="stats">
    <div class="stat">🏆 <span id="score">0</span></div>
    <div class="stat">🔥 Best: <span id="high-score">0</span></div>
    <div class="stat">⏱️ <span id="time">45</span>s</div>
    <div class="stat"><span id="lives">❤️❤️❤️</span></div>
  </div>
  <div id="combo"></div>
  <div id="legend">
    <div class="legend-item">🐹 +10</div>
    <div class="legend-item">🥇 +50 Golden</div>
    <div class="legend-item">💣 -30 BOMB!</div>
    <div class="legend-item">👿 +100 Boss (3 hits)</div>
  </div>
  <div id="grid">
    <!-- Holes generated by JS -->
  </div>
  <button class="btn" id="startBtn">Start Game</button>
  <div id="game-over" class="hidden">
    <h2>Time's Up! 🎉</h2>
    <p style="font-size:20px">Score: <b id="final-score">0</b></p>
    <button class="btn" id="restartBtn">Play Again</button>
  </div>
  <script>
    // Build grid
    const grid = document.getElementById('grid');
    for (let i = 0; i < 9; i++) {
      grid.innerHTML += `<div class="hole" data-i="${i}" onclick="whack(${i})"><span class="mole-emoji"></span></div>`;
    }
  </script>
  <script src="game.js"></script>
</body>
</html>
