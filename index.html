<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whack-a-Mole</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <h1>🐹 Whack-a-Mole</h1>
    <div id="hud">
      <div class="hud-item"><span class="lbl">SCORE</span><span id="score">0</span></div>
      <div class="hud-item"><span class="lbl">BEST</span><span id="best">0</span></div>
      <div class="hud-item"><span class="lbl">TIME</span><span id="timer">30</span></div>
      <div class="hud-item"><span class="lbl">COMBO</span><span id="combo">x1</span></div>
    </div>
    <div id="board"></div>
    <div id="start-screen">
      <h2>Ready?</h2>
      <div id="diff-btns">
        <button data-speed="easy">🐢 Easy</button>
        <button data-speed="normal" class="active">🐹 Normal</button>
        <button data-speed="hard">👾 Hard</button>
      </div>
      <button id="start-btn">START GAME</button>
    </div>
    <div id="end-screen" class="hidden">
      <h2>Time's Up!</h2>
      <p id="final-score"></p>
      <button id="play-again">Play Again</button>
    </div>
  </div>
  <script src="src/constants.js"></script>
  <script src="src/mole.js"></script>
  <script src="src/game.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
